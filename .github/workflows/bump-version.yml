name: Bump minor version

on:
  push:
    branches:
      - main
    paths-ignore:
      - "package.json"
      - "src/version.ts"
      - "wrangler.toml"

permissions:
  contents: write

jobs:
  bump:
    if: github.repository == 'agilexmarketing/zarazextra'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Bump minor version
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pkgPath = 'package.json';
          const versionPath = 'src/version.ts';
          const wranglerPath = 'wrangler.toml';

          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const parts = String(pkg.version || '1.0').split('.').map(Number);
          const major = Number.isFinite(parts[0]) ? parts[0] : 1;
          const minor = Number.isFinite(parts[1]) ? parts[1] + 1 : 1;
          const next = `${major}.${minor}`;

          pkg.version = next;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          fs.writeFileSync(
            versionPath,
            `export const ZARAZEXTRA_NAME = 'ZarazExtra';\nexport const ZARAZEXTRA_VERSION = '${next}';\n`
          );

          let wrangler = fs.existsSync(wranglerPath) ? fs.readFileSync(wranglerPath, 'utf8') : '';

          if (/ZARAZEXTRA_VERSION\s*=/.test(wrangler)) {
            wrangler = wrangler.replace(/ZARAZEXTRA_VERSION\s*=\s*"[^"]*"/, `ZARAZEXTRA_VERSION = "${next}"`);
          } else {
            wrangler += `\n[vars]\nZARAZEXTRA_VERSION = "${next}"\nZARAZEXTRA_NAME = "ZarazExtra"\n`;
          }

          if (!/ZARAZEXTRA_NAME\s*=/.test(wrangler)) {
            wrangler = wrangler.replace(/\[vars\]\s*\n/, '[vars]\nZARAZEXTRA_NAME = "ZarazExtra"\n');
          }

          fs.writeFileSync(wranglerPath, wrangler);
          NODE

      - name: Commit version bump
        run: |
          git config user.name "zarazextra-version-bot"
          git config user.email "actions@github.com"
          git add package.json src/version.ts wrangler.toml
          git commit -m "chore: bump ZarazExtra version [skip ci]" || exit 0
          git push
