name: Auto update from ZarazExtra upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout installed repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream
        run: |
          git config user.name "zarazextra-auto-updater"
          git config user.email "zarazextra-auto-updater@users.noreply.github.com"
          git remote add upstream https://github.com/agilexmarketing/zarazextra.git || true
          git fetch upstream main
          git reset --hard upstream/main
          git push origin main --force
