<script>
(function () {
  if (window.__zarazExtraIdentityInstalled) return;
  window.__zarazExtraIdentityInstalled = true;

  var PHONE_PREFIX = '40';
  var last = {};

  function clean(v, max) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/\s+/g, ' ').trim().slice(0, max || 254);
  }

  function lower(v, max) { return clean(v, max).toLowerCase(); }

  function setZ(key, value) {
    value = clean(value);
    if (!value || last[key] === value) return;
    if (!window.zaraz || typeof window.zaraz.set !== 'function') {
      setTimeout(function () { setZ(key, value); }, 250);
      return;
    }
    window.zaraz.set(key, value, { scope: 'persist' });
    last[key] = value;
  }

  function email(v) {
    v = lower(v, 254).replace(/^mailto:/i, '');
    var m = v.match(/[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}/i);
    return m ? m[0].toLowerCase() : '';
  }

  function phone(v) {
    v = clean(v, 40);
    if (!v || /@/.test(v)) return '';
    v = v.replace(/^tel:/i, '');
    v = v.replace(/(ext|extension|int|interior)\.?\s*\d+$/i, '');
    v = v.replace(/\+/g, '').replace(/\s/g, '').replace(/-/g, '').replace(/\(/g, '').replace(/\)/g, '').replace(/[^\d]/g, '');
    v = v.replace(/^00/, '').replace(/^0+/, '');
    if (!v || v.length < 8 || v.length > 15) return '';
    if (/^(\d)\1+$/.test(v)) return '';
    if (v.substring(0, PHONE_PREFIX.length) !== PHONE_PREFIX) v = PHONE_PREFIX + v;
    return v;
  }

  function name(v) {
    v = lower(v, 80)
      .replace(/^(mr|mrs|ms|miss|dr|prof|domnul|doamna|dl|dna|d-na|d-l)\.?\s+/i, '')
      .replace(/\d+/g, '')
      .replace(/@|https?:\/\/|www\./gi, '')
      .replace(/\s+/g, ' ')
      .trim();
    try { v = v.replace(/[^\p{L}\s'\-]/gu, ''); }
    catch (e) { v = v.replace(/[^a-zA-ZăâîșțĂÂÎȘȚ\s'\-]/g, ''); }
    return v.length >= 2 ? v : '';
  }

  function fieldText(el) {
    var out = [];
    out.push(el.type || '', el.name || '', el.id || '', el.autocomplete || '', el.placeholder || '', el.getAttribute('aria-label') || '', el.title || '');
    if (el.labels) for (var i = 0; i < el.labels.length; i++) out.push(el.labels[i].textContent || '');
    return lower(out.join(' '), 500);
  }

  function splitFullName(v) {
    v = name(v);
    if (!v) return;
    var parts = v.split(' ').filter(Boolean);
    if (parts[0]) { setZ('fn', parts[0]); setZ('first_name', parts[0]); }
    if (parts.length > 1) { var ln = parts.slice(1).join(' '); setZ('ln', ln); setZ('last_name', ln); }
  }

  function process(el) {
    if (!el || !el.tagName) return;
    var tag = el.tagName.toLowerCase();
    if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') return;
    var v = clean(el.value);
    if (!v || v.length < 2) return;
    var t = fieldText(el);
    if (/password|parola|pwd|captcha|token|csrf|otp|2fa|card|credit|cc_|cc-|cvc|cvv|iban|bic|swift|amount|suma|valoare|value|price|pret|quantity|qty/i.test(t)) return;

    var em = email(v);
    if (em) { setZ('em', em); setZ('email', em); return; }

    if (/phone|telephone|telefon|tel|mobile|mobil|gsm|whatsapp|contact/i.test(t)) {
      var ph = phone(v);
      if (ph) { setZ('ph', ph); setZ('phone', ph); setZ('phone_number', ph); }
      return;
    }

    if (/first.*name|given.*name|forename|fname|first_name|prenume/i.test(t)) {
      var fn = name(v);
      if (fn) { setZ('fn', fn); setZ('first_name', fn); }
      return;
    }

    if (/last.*name|family.*name|surname|lname|last_name|nume.*familie/i.test(t) || /\bnume\b/i.test(t)) {
      var ln = name(v);
      if (ln) { setZ('ln', ln); setZ('last_name', ln); }
      return;
    }

    if (/full.*name|name.*full|contact.*name|customer.*name|nume.*prenume|prenume.*nume/i.test(t)) splitFullName(v);
  }

  function processForm(form) {
    if (!form || !form.querySelectorAll) return;
    var fields = form.querySelectorAll('input, textarea, select');
    for (var i = 0; i < fields.length; i++) process(fields[i]);
  }

  document.addEventListener('blur', function (e) { process(e.target); }, true);
  document.addEventListener('submit', function (e) { processForm(e.target); }, true);
})();
</script>
